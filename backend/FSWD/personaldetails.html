<!DOCTYPE html>
<html>
    <HEAD>
    <title>student registration form</title>
    <h2>STUDENT REGISTRATION FORM</h2>
</HEAD>
<BODY>
    <FORM>
        <LABEL>NAME</LABEL>
           <INPUT TYPE="TEXT" NAME="NAME" placeholder="ENTER NAME" disabled>
        
        <BR></BR>

        <LABEL>EMAIL</LABEL>
        <INPUT TYPE="EMAIL" NAME="EMAIL" placeholder="ENTER EMAIL" required>
            <BR><BR>


        <LABEL>PASSWORD</LABEL>
        <INPUT type="password" NAME="PASSWORD" placeholder="ENTER PASSWORD" size="30" maxlength="30" required>        
        <BR><BR>

         <LABEL>TELEPHONE</LABEL>
         <INPUT  TYPE="tel" NAME="TELEPHONE" placeholder="ENTER TELEPHONE" aria-placeholder="8756676789" PATTERN="[0-9]{10}">
            
          <BR><BR>
                
          <LABEL>DATE</LABEL>  
          <INPUT TYPE="DATE" NAME="DATE">
            <BR><BR>    

                
          <label>GENDER</label>
          <INPUT TYPE="radio" NAME="GENDER" VALUE="MALE">MALE     
             <INPUT TYPE="radio" NAME="GENDER" VALUE="FEMALE">FEMALE     
                 <INPUT TYPE="radio" NAME="GENDER" VALUE="OTHERS">OTHERS
                    <BR><BR>
                        
                       
          <LABEL>AGE</LABEL>
          <INPUT TYPE="number" NAME=""GENDER">
            <BR><BR>
                
            <LABEL>TIME</LABEL>
            <input type="time" name="TIME" min="18" max="60">
            <BR><BR>  


                    <LABEL>COLOR</LABEL>
             <INPUT TYPE="color" NAME="COLOR">
                <BR><BR>


         
             <LABEL>FSWD SKILL</LABEL>
             <INPUT TYPE="range" NAME="SKILL">
                <BR><BR>
                    
            <LABEL>UPLOAD  RESUME</LABEL>
            <input type="file" NAME=""FILE">
            <BR><BR>

                <LABEL>HOBBIES</LABEL>
                <input type="checkbox" NAME="HOBBIES" VALUE="READING">READING<BR>
                <input type="checkbox" NAME="HOBBIES" VALUE="WRITTING">WRITING<BR>
                <input type="checkbox" NAME="HOBBIES" VALUE="DANCING">DANCING<BR> 
                 <input type="checkbox" NAME="HOBBIES" VALUE="SINGING">SINGING<BR>
                    <BR><BR>

                          
               <LABEL>SELECT STATE</LABEL>
               <select name="state">
                <option>TELANGANA</option>
                 <option>ANDHRA</option>
                  <option>KASHMIR</option>
                   <option>ASSAM</option>
                    <option>ARUNACHAL</option>
                     <option>SIKKIM</option>
                      <option>MANIPUR</option>
                       <option>RAJASTAN</option>
                        <option>MAHARASTRA</option>
                         <option>MEGHALAYA</option>
                         <BR><BR>
 
                            <label>adress</label>
                           <input type="="textarea" name="adress" rows="3" cols="30">
                           <br><br>

                        
               </select>         
                  
                           <input type="submit"  value="save">
                 
                
            <A href="QUALIFICATION.HTML">PLEASE  ENTER  HERE  FOR EDUCATION QUALIFICATION</A>
                

                

                

        </FORM>
</BODY>
